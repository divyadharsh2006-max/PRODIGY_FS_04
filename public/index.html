<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Real-Time Chat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen">
  <div class="auth-card">
    <h1>💬 Real-Time Chat</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" id="register-username" placeholder="Username" required />
      <input type="password" id="register-password" placeholder="Password (min 4 chars)" required />
      <button type="submit">Create Account</button>
      <p class="error" id="register-error"></p>
    </form>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen" class="screen hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span id="current-username"></span>
      <button id="logout-btn" title="Logout">⏻</button>
    </div>

    <div class="sidebar-section">
      <h3>Rooms</h3>
      <ul id="room-list"></ul>
    </div>

    <div class="sidebar-section">
      <h3>Direct Messages</h3>
      <ul id="user-list"></ul>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <h2 id="chat-title">Select a room or user</h2>
      <span id="typing-indicator" class="typing-indicator"></span>
    </header>

    <div id="messages" class="messages"></div>

    <form id="message-form" class="message-form">
      <label class="file-label" title="Attach a file">
        📎
        <input type="file" id="file-input" hidden />
      </label>
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
    <div id="file-preview" class="file-preview hidden"></div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
